name: build
on: [push, workflow_dispatch]
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {run: unzip -q catfive_naga.zip}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: 21}}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: 8.11}}, {run: cd catfive_naga && gradle build}, {uses: actions/upload-artifact@v4, with: {name: mod, path: "catfive_naga/build/libs/*.jar"}}]}}
